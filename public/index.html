<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Image Downloader Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #e0e0e0; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        input { padding: 12px; width: 85%; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; margin-bottom: 10px; outline: none; }
        button { padding: 12px; background: #00ff00; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: black; width: 90%; margin-bottom: 10px; }
        img { max-width: 100%; border-radius: 10px; margin-top: 20px; border: 2px solid #00ff00; }
        .hidden { display: none; }
        .history-item { background: #252525; padding: 10px; margin-top: 5px; border-radius: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 IA Photo Search</h1>
        <button id="btn-login" style="background:#4285F4; color:white;">Login com Google</button>

        <div id="app-content" class="hidden">
            <p id="user-info"></p>
            <input type="text" id="tema" placeholder="O que você quer buscar?">
            <button onclick="buscarImagem()">Buscar com Gemini + Pexels</button>
            <button onclick="logout()" style="background:#ff4444">Sair</button>
            
            <div id="resultado"></div>
            <hr>
            <h3>Histórico de Pesquisas</h3>
            <div id="historico"></div>
        </div>
    </div>

    <script>
        // NOVAS CREDENCIAIS
        const firebaseConfig = {
          apiKey: "AIzaSyBmLnRA5XFZGPL0Y4Cjn4Fk3_FohlNCb1Q",
          authDomain: "cerebro-fba58.firebaseapp.com",
          databaseURL: "https://cerebro-fba58-default-rtdb.firebaseio.com",
          projectId: "cerebro-fba58",
          storageBucket: "cerebro-fba58.firebasestorage.app",
          messagingSenderId: "351768167722",
          appId: "1:351768167722:web:64a7c00acc2f90334d0a53",
          measurementId: "G-ZJZ21F6B6P"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const fs = firebase.firestore();
        let userUid = null;

        document.getElementById('btn-login').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());

        auth.onAuthStateChanged(user => {
            if (user) {
                userUid = user.uid;
                document.getElementById('btn-login').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('user-info').innerText = `Olá, ${user.displayName}`;
                carregarHistorico();
            }
        });

        async function buscarImagem() {
            const tema = document.getElementById('tema').value;
            const resDiv = document.getElementById('resultado');
            resDiv.innerHTML = "⏳ IA processando...";

            // Aqui chamamos o seu backend no Render
            try {
                const response = await fetch('https://baixar-imagem.onrender.com/buscar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tema: tema, uid: userUid })
                });
                const data = await response.json();
                resDiv.innerHTML = `<img src="${data.image_url}"><br><a href="${data.image_url}" target="_blank" style="color:#00ff00">Download HD</a>`;
            } catch (e) {
                resDiv.innerHTML = "❌ Erro ao conectar com o servidor Render.";
            }
        }

        function carregarHistorico() {
            db.ref('historico/' + userUid).limitToLast(10).on('value', snap => {
                const div = document.getElementById('historico');
                div.innerHTML = "";
                snap.forEach(child => {
                    div.innerHTML = `<div class="history-item"><span>${child.val().pesquisa}</span></div>` + div.innerHTML;
                });
            });
        }

        function logout() { auth.signOut(); location.reload(); }
    </script>
</body>
</html>
