<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Photo Search Pro</title>
    <!-- Bibliotecas Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="manifest" href="/manifest.json">
    <style>
        body { font-family: sans-serif; background: #0f0f0f; color: #e0e0e0; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        input { padding: 12px; width: 85%; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; margin-bottom: 10px; outline: none; }
        button { padding: 12px 25px; background: #00ff00; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: black; width: 90%; margin-bottom: 10px; }
        img { max-width: 100%; border-radius: 10px; margin-top: 20px; border: 2px solid #00ff00; }
        .history-item { background: #252525; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #00ff00; font-size: 0.9em; }
        /* Botão de apagar pequeno e circular */
        .btn-del { background: #ff4444; color: white; border: none; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer; flex-shrink: 0; padding: 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 IA Photo Search</h1>
        <button id="btn-login" style="background:#4285F4; color:white;">Login com Google</button>

        <div id="app-content" class="hidden">
            <p id="user-info"></p>
            <input type="text" id="tema" placeholder="O que deseja buscar?">
            <button onclick="buscarImagem()">Buscar com Gemini + Pexels</button>
            <button onclick="logout()" style="background:#333; color: white;">Sair</button>
            <div id="resultado"></div>
            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            <h3>🕰️ Histórico (Firestore + Realtime)</h3>
            <div id="historico"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmLnRA5XFZGPL0Y4Cjn4Fk3_FohlNCb1Q",
            authDomain: "cerebro-fba58.firebaseapp.com",
            databaseURL: "https://cerebro-fba58-default-rtdb.firebaseio.com",
            projectId: "cerebro-fba58",
            storageBucket: "cerebro-fba58.firebasestorage.app",
            messagingSenderId: "351768167722",
            appId: "1:351768167722:web:64a7c00acc2f90334d0a53"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let globalUid = null;

        document.getElementById('btn-login').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());

        auth.onAuthStateChanged(user => {
            if (user) {
                globalUid = user.uid;
                document.getElementById('btn-login').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('user-info').innerText = `Olá, ${user.displayName}`;
                carregarHistorico();
            }
        });

        async function buscarImagem() {
            const tema = document.getElementById('tema').value;
            if(!tema || !globalUid) return;
            const resDiv = document.getElementById('resultado');
            resDiv.innerHTML = "⏳ Processando...";
            try {
                const response = await fetch('https://imagens-ia.onrender.com/buscar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tema: tema, uid: globalUid })
                });
                const data = await response.json();
                resDiv.innerHTML = `<img src="${data.image_url}"><br><a href="${data.image_url}" target="_blank" style="color:#00ff00; display:block; margin-top:10px;">Download HD</a>`;
            } catch (e) {
                resDiv.innerHTML = "❌ Erro ao conectar com o servidor.";
            }
        }

        function carregarHistorico() {
            db.ref('historico/' + globalUid).on('value', snap => {
                const div = document.getElementById('historico');
                div.innerHTML = "";
                snap.forEach(child => {
                    div.innerHTML = `
                        <div class="history-item">
                            <span>${child.val().pesquisa}</span>
                            <button class="btn-del" onclick="remover('${child.key}')">X</button>
                        </div>` + div.innerHTML;
                });
            });
        }

        function remover(id) {
            db.ref('historico/' + globalUid + '/' + id).remove();
        }

        // Lógica da tecla Voltar para limpar a tela
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
            document.getElementById("resultado").innerHTML = "";
            document.getElementById("tema").value = "";
        };

        function logout() { auth.signOut(); location.reload(); }
    </script>
</body>
</html>
